packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - i18next@26.5.12
  - knip@6.44.0

# One React for the whole monorepo (Expo SDK 58 pins 19.3.0). Shared packages are
# symlinked, so a second React version would be bundled twice -> "Invalid hook call".
overrides:
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": ~19.3.0
