packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@sentry/cli": true
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - i18next@26.5.12
  - knip@6.44.0
  - "@expo/cli@58.1.21"
  - "@expo/metro-config@58.0.23"
  - "@expo/router-server@58.0.23"
  - babel-preset-expo@58.0.26
  - expo-file-system@58.0.14
  - expo@58.0.26
  - expo-router@58.0.32

# One React for the whole monorepo (Expo SDK 58 pins 19.3.0). Shared packages are
# symlinked, so a second React version would be bundled twice -> "Invalid hook call".
overrides:
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": ~19.3.0

# Versions shared by more than one workspace. Reference them as "catalog:"; bump them here only.
catalog:
  "@hugeicons/core-free-icons": "^4.4.0"
  "@tanstack/react-query": "^5.107.1"
  "@types/node": "^24"
  "@types/react": "~19.3.0"
  "axios": "^1.21.1"
  "class-variance-authority": "^0.7.1"
  "i18next": "^27.1.3"
  "react": "19.3.0"
  "react-dom": "19.3.0"
  "react-hook-form": "^7.92.0"
  "react-i18next": "^18.0.2"
  "tailwindcss": "^4.3.5"
  "tw-animate-css": "^1.4.0"
  "typescript": "~6.0.3"
  "zod": "^4.6.7"
  "zustand": "^5.1.0"
